name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Lint, type-check, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      # Unit/integration tests (jest via turbo). Without this step a broken test
      # could sit on main unnoticed — ReportsMain's fixtures did for months.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
