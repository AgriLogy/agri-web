name: Release

on:
  push:
    branches: [main]
  # Manual fallback, matching agri-api / agri-core / agri-db. Needed whenever a
  # merge lands without its push event producing a run — as happened when the
  # org's repos were private and no workflow ran at all: #133 merged, but the
  # release (and so the Vercel production deploy that rides the release commit)
  # never fired, and a push-only trigger left no way to catch up short of an
  # empty commit.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # CI is the source of truth — disable Husky hooks so semantic-release's
    # auto-generated release commit isn't blocked by commit-msg / pre-commit.
    env:
      HUSKY: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
