name: Vercel Production

# Deploy the farmer web app to Vercel PRODUCTION on every push to main (i.e.
# every merged PR), so app.agrogo always reflects main without a manual
# `vercel --prod`. Uses the same single repo secret as the preview workflow:
# VERCEL_TOKEN (a Vercel access token for the agrilogys-projects team).
#
# semantic-release's "chore(release): … [skip ci]" commit is skipped by the
# [skip ci] marker (and by the guard below), so a merge deploys once — the
# merged code — not twice.

on:
  push:
    branches: [main]

# One production deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_0qvi19Uq395tQgY3GWshb0YV
  VERCEL_PROJECT_ID: prj_qiqO8LWnoYfgEGxkyALrQ6AUw3oz

jobs:
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts (production)
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifacts to Vercel (production)
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
